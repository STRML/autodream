name: tests

# push is filtered to main on purpose: with `pull_request:` also enabled, an
# unfiltered push trigger runs every PR commit twice. Branch work is covered by
# the PR trigger; both routes into main - a merge and a direct push - fire the
# push trigger. A feature branch with no PR runs nothing, which is the trade.
#
# Cost: this job used to run on macOS, billed at 10x a Linux minute, for about 11 minutes.
# 100 runs in two days (83 on one of them) came from every push to a PR branch starting a
# fresh run while the last one was still going. Now: it runs on Linux, a newer push to the
# same ref cancels the older run, a change that touches no code or test starts nothing, and
# a draft PR starts nothing until it is marked ready. The launchd suites stay on macOS in
# launchd.yml and run only when a launchd file changes.
#
# Not all markdown is docs. The prompts and the adapters' triage.md and facts.md are code: the
# suite asserts on what they say, and #175 changed only a prompt, skipped CI under a plain
# '**.md' ignore, and left two tests red on main (#178). So the filter is `paths` with negations,
# where the last matching pattern wins: everything, minus docs, plus that markdown back again.
# `paths-ignore` cannot re-include, and an event cannot have both. Keep the two lists in step.
# Code under docs/ or example/ is code too: the comment ratchet counts every tracked .sh, .py and
# JS or TS file, so those extensions come back after the exclusions (a path filter has no braces).
on:
  push:
    branches: [main]
    paths:
      - '**'
      - '!**.md'
      - '!docs/**'
      - '!example/**'
      - '!LICENSE'
      - 'prompts/**'
      - 'adapters/**'
      - 'docs/demo/**'
      - 'docs/screenshots/fixture.py'
      - '**.sh'
      - '**.py'
      - '**.js'
      - '**.jsx'
      - '**.mjs'
      - '**.cjs'
      - '**.ts'
      - '**.tsx'
      - '**.mts'
      - '**.cts'
  pull_request:
    # ready_for_review is not a default type: without it, marking a draft ready starts nothing
    # and the job's draft skip would leave the PR with no test run.
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '**'
      - '!**.md'
      - '!docs/**'
      - '!example/**'
      - '!LICENSE'
      - 'prompts/**'
      - 'adapters/**'
      - 'docs/demo/**'
      - 'docs/screenshots/fixture.py'
      - '**.sh'
      - '**.py'
      - '**.js'
      - '**.jsx'
      - '**.mjs'
      - '**.cjs'
      - '**.ts'
      - '**.tsx'
      - '**.mts'
      - '**.cts'

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The suite is split into eight shards that run at once, each an eighth of the tests and unit
  # suites chosen round-robin (RUNALL_SHARD=i/n in tests/run-all.sh; tests/shard.sh proves the
  # shards partition the suite exactly). At four shards each took 4 to 6 minutes by 2026-11-16 (the
  # suite doubled in a month), and a shard spends only about 6 seconds outside its tests, so twice
  # the shards halves the wait for about the same runner minutes. Keep the matrix and the /8 below in
  # step: tests/shard.sh fails if they disagree, because a shard that no job runs is part of the
  # suite nobody runs. docs/investigations/2026-11-17-ci-cost.md has the numbers.
  # The unit suites used to run a second time in their own step here. run-all.sh already runs every
  # one of them, so that step only repeated 47 seconds of work.
  shards:
    name: test (${{ matrix.shard }}/8)
    # Linux. The suites went through bin/portable.sh for the BSD and GNU date and stat, so
    # they no longer need a Mac. The suites that drive launchd (install, scheduler-label,
    # autodream-now) run in launchd.yml on macOS, and only when launchd files change.
    # Every suite runs against tests/mock-claude.sh, so nothing here needs a model.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      # Depth 2: on a PR the checkout is the test merge, whose first parent is the base, so
      # HEAD^1..HEAD is exactly what the PR changes.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      # A PR that changes only the web dashboard runs only its suite (.github/ci-scope.sh lists
      # what counts, tests/ci-scope.sh pins it). Pushes to main, a diff that fails, and any path
      # the selector does not know all run the whole suite.
      - name: scope
        id: scope
        run: |
          scope=full
          if [ "${{ github.event_name }}" = pull_request ]; then
            scope=$(bash .github/ci-scope.sh HEAD^1 HEAD)
          fi
          echo "scope: $scope"
          echo "scope=$scope" >> "$GITHUB_OUTPUT"

      # The comment ratchet parses shell with shfmt and fails when it is missing, so the job that
      # runs it installs it: every shard of a full run (the ratchet is one of the unit suites
      # run-all.sh runs) and shard 0 of a web-only run.
      - name: shfmt
        if: steps.scope.outputs.scope == 'full' || matrix.shard == 0
        run: |
          sudo apt-get install -y --no-install-recommends shfmt
          shfmt --version

      - name: web suite only
        if: steps.scope.outputs.scope == 'web' && matrix.shard == 0
        run: bash tests/autodream-web.sh

      # A web-only PR can still add a comment to web/app.js, so the ratchet runs beside the web
      # suite. On a full run it is one of run-all.sh's unit suites.
      - name: comment ratchet, web scope
        if: steps.scope.outputs.scope == 'web' && matrix.shard == 0
        run: bash tests/comment-ratchet.sh

      # gtimeout: four oversized-gate assertions look for GNU timeout under that name,
      # which is how it is installed on a Mac. On Linux it is plain `timeout`.
      - name: check deps
        if: steps.scope.outputs.scope == 'full'
        run: |
          jq --version
          python3 --version
          mkdir -p "$HOME/.local/bin"
          ln -sf "$(command -v timeout)" "$HOME/.local/bin/gtimeout"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # L1 workers run under bubblewrap on Linux (bin/l1-confine.sh). Without it the probe says "no
      # sandbox tool" and the whole bwrap branch, the real-confinement cases in tests/l1-confine.sh and
      # the confined run-level tests, would skip here and run nowhere. Ubuntu 24.04 limits unprivileged
      # user namespaces through AppArmor; lifting that is allowed to fail, and a runner where bwrap
      # still cannot start is a runner where the probe says no and those cases skip.
      - name: bubblewrap
        if: steps.scope.outputs.scope == 'full'
        run: |
          sudo apt-get install -y --no-install-recommends bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          bwrap --version

      - name: run-all, shard ${{ matrix.shard }} of 8
        if: steps.scope.outputs.scope == 'full'
        env:
          RUNALL_TIMES: ${{ runner.temp }}/times.txt
        run: RUNALL_SHARD=${{ matrix.shard }}/8 bash tests/run-all.sh

      # What this shard spent its time on, slowest first. Run on failure too: a slow shard is
      # exactly when this is wanted. The split is round-robin by position; if one shard keeps
      # finishing well behind the others, these numbers are what a weighted split needs.
      - name: slowest entries in this shard
        if: always()
        env:
          RUNALL_TIMES: ${{ runner.temp }}/times.txt
        run: |
          test -f "$RUNALL_TIMES" || { echo "no timings written"; exit 0; }
          awk '{ t += $1 } END { print "total seconds in tests and suites: " t }' "$RUNALL_TIMES"
          sort -rn "$RUNALL_TIMES" | head -12

  # One check that stands for the eight shards, under the name the single job always had, so
  # anything that waits on `test` keeps working. A draft PR skips the shards and so skips this.
  test:
    needs: shards
    # !cancelled(), not always(): a newer push cancels this run, and the shards then read as cancelled.
    # always() would run this job anyway and fail it, painting the superseded commit red.
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: every shard passed
        env:
          SHARDS: ${{ needs.shards.result }}
        run: |
          echo "shards: $SHARDS"
          test "$SHARDS" = success

  shellcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      # The shipped scripts are held at `warning`. A cron job nobody watches
      # cannot afford a swallowed exit code, and that is the class shellcheck
      # actually catches (SC2164, SC2155).
      - name: shellcheck bin + install
        run: shellcheck --severity=warning bin/*.sh adapters/*/*.sh install.sh .github/*.sh

      # Test code is held at `error` only. tests/run-all.sh has ~24 SC2155
      # hits from `local x=$(cmd)` in assertion helpers, where masking a return
      # value has no consequence. Tighten this if that stops being true.
      - name: shellcheck tests
        run: shellcheck --severity=error tests/*.sh
