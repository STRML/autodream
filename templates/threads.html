<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'none'">
<title>Dropped threads</title>
<style>
:root { color-scheme: light dark; font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
body { margin: 0; background: Canvas; color: CanvasText; }
header { position: sticky; top: 0; z-index: 1; padding: 1rem max(1rem, calc((100vw - 1100px) / 2)); background: Canvas; border-bottom: 1px solid color-mix(in srgb, CanvasText 20%, transparent); }
h1 { margin: 0 0 .2rem; font-size: 1.35rem; }
#generated { color: GrayText; font-size: .85rem; }
.controls, nav { display: flex; flex-wrap: wrap; gap: .55rem; margin-top: .8rem; }
input, select, button { font: inherit; color: inherit; background: Canvas; border: 1px solid color-mix(in srgb, CanvasText 30%, transparent); border-radius: .45rem; padding: .45rem .65rem; }
button { cursor: pointer; }
button[aria-pressed="true"] { background: Highlight; color: HighlightText; }
main { max-width: 1100px; margin: 1rem auto; padding: 0 1rem 3rem; }
#counts { display: flex; flex-wrap: wrap; gap: .45rem; color: GrayText; }
article { border: 1px solid color-mix(in srgb, CanvasText 20%, transparent); border-radius: .6rem; padding: .85rem 1rem; margin: .7rem 0; }
article h2 { margin: 0; font-size: 1.05rem; }
.meta, .goal { margin: .3rem 0; color: GrayText; }
.actions { display: flex; flex-wrap: wrap; gap: .5rem; margin-top: .6rem; }
#empty { color: GrayText; padding: 1rem 0; }
</style>
</head>
<body>
<header>
  <h1>Dropped threads</h1>
  <div id="generated"></div>
  <div class="controls">
    <label>Search <input id="search" type="search" autocomplete="off"></label>
    <label>Repo <select id="repo"><option value="">All repositories</option></select></label>
  </div>
  <nav id="views" aria-label="Thread views"></nav>
</header>
<main>
  <div id="counts" aria-live="polite"></div>
  <div id="threads"></div>
  <p id="empty" hidden>No threads in this view.</p>
</main>
<script id="threads-data" type="application/json">__THREADS_JSON__</script>
<script>
"use strict";
const data = JSON.parse(document.getElementById("threads-data").textContent);
const viewNames = ["Dropped", "Open", "Ideas", "Done"];
const selectedView = "Dropped";
const views = document.getElementById("views");
const list = document.getElementById("threads");
const counts = document.getElementById("counts");
const search = document.getElementById("search");
const repo = document.getElementById("repo");
const empty = document.getElementById("empty");
document.getElementById("generated").textContent = "Generated " + new Date(data.generated_at).toLocaleString() + " · as of " + data.as_of;
let activeView = selectedView;

function isInView(thread, view) {
  if (view === "Dropped") return thread.display_status === "dropped";
  if (view === "Open") return thread.display_status === "open" && thread.kind !== "idea";
  if (view === "Ideas") return thread.kind === "idea" && thread.display_status !== "done" && thread.display_status !== "closed_by_sam";
  return thread.display_status === "done" || thread.display_status === "closed_by_sam";
}

function makeButton(label, command) {
  const button = document.createElement("button");
  button.type = "button";
  button.textContent = label;
  button.addEventListener("click", function () { copyCommand(command, button, label); });
  return button;
}

function copyCommand(command, button, label) {
  if (!command) return;
  const copied = function () {
    button.textContent = "Copied";
    window.setTimeout(function () { button.textContent = label; }, 1200);
  };
  const fallback = function () {
    const input = document.createElement("textarea");
    input.value = command;
    document.body.appendChild(input);
    input.select();
    document.execCommand("copy");
    input.remove();
    copied();
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(command).then(copied, fallback);
    return;
  }
  fallback();
}

function commandsFor(thread) {
  if (!/^t-[0-9a-f]{8}$/.test(thread.id)) return null;
  return {
    resume: "~/.claude/autodream/threads.sh resume " + thread.id,
    close: "~/.claude/autodream/threads.sh close " + thread.id
  };
}

function render() {
  const query = search.value.toLocaleLowerCase();
  const repoFilter = repo.value;
  const filtered = data.threads.filter(function (thread) {
    const text = [thread.title, thread.goal, thread.repo, thread.id].join(" ").toLocaleLowerCase();
    return isInView(thread, activeView) && (!query || text.includes(query)) && (!repoFilter || thread.repo === repoFilter);
  });
  counts.replaceChildren();
  viewNames.forEach(function (name) {
    const amount = data.threads.filter(function (thread) { return isInView(thread, name); }).length;
    const label = document.createElement("span");
    label.textContent = name + " (" + amount + ")";
    counts.appendChild(label);
  });
  list.replaceChildren();
  filtered.forEach(function (thread) {
    const card = document.createElement("article");
    const title = document.createElement("h2");
    title.textContent = thread.title || thread.goal;
    const meta = document.createElement("p");
    meta.className = "meta";
    meta.textContent = [thread.repo || "No repository", thread.sessions.length + " sessions", thread.last_seen, thread.display_status].join(" · ");
    const goal = document.createElement("p");
    goal.className = "goal";
    goal.textContent = thread.goal;
    const actions = document.createElement("div");
    actions.className = "actions";
    const commands = commandsFor(thread);
    if (commands) {
      actions.appendChild(makeButton("Copy resume command", commands.resume));
      actions.appendChild(makeButton("Copy close command", commands.close));
    }
    card.appendChild(title);
    card.appendChild(meta);
    card.appendChild(goal);
    card.appendChild(actions);
    list.appendChild(card);
  });
  empty.hidden = filtered.length !== 0;
}

viewNames.forEach(function (name, index) {
  const button = document.createElement("button");
  button.type = "button";
  button.textContent = name;
  button.setAttribute("aria-pressed", String(index === 0));
  button.addEventListener("click", function () {
    activeView = name;
    Array.from(views.children).forEach(function (child) { child.setAttribute("aria-pressed", String(child === button)); });
    render();
  });
  views.appendChild(button);
});
Array.from(new Set(data.threads.map(function (thread) { return thread.repo; }).filter(Boolean))).sort().forEach(function (name) {
  const option = document.createElement("option");
  option.value = name;
  option.textContent = name;
  repo.appendChild(option);
});
search.addEventListener("input", render);
repo.addEventListener("change", render);
render();
</script>
</body>
</html>
