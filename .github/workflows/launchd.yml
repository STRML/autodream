name: launchd

# macOS only, and only when something that talks to launchd changes. macOS minutes bill at
# 10x a Linux minute, and these suites are the only ones that need plutil, launchctl or a
# real BSD userland. Everything else runs on Linux in tests.yml.
#
# bin/portable.sh is in the path list on purpose: its BSD branch is what a Mac runs, and
# Linux never executes it.
#
# skills/autodream/SKILL.md is in it too: tests/install-skill.sh reads its `name:` line through
# the link install.sh makes, and this list is the only CI that runs that suite (#178).
#
# A weekly run does the whole suite on macOS, in four shards, under the stock bash 3.2 the nightly uses.
# Bash 3.2 and BSD tools are where this repo's silent failures have come from (an empty
# array under `set -u`, a BSD-only flag), and a push that touches none of the paths below
# would otherwise never see them.
on:
  push:
    branches: [main]
    paths:
      - 'install.sh'
      - 'launchd/**'
      - 'bin/autodream-now.sh'
      - 'bin/scheduler-label.sh'
      - 'bin/lib-install-dir.sh'
      - 'bin/portable.sh'
      - 'tests/install-*.sh'
      - 'tests/scheduler-label.sh'
      - 'tests/autodream-now.sh'
      - 'tests/portable.sh'
      - 'tests/lib-assert.sh'
      - 'skills/autodream/SKILL.md'
      - '.github/workflows/launchd.yml'
  pull_request:
    # ready_for_review is not a default type: without it, marking a draft ready starts nothing
    # and the job's draft skip would leave the PR with no test run.
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'install.sh'
      - 'launchd/**'
      - 'bin/autodream-now.sh'
      - 'bin/scheduler-label.sh'
      - 'bin/lib-install-dir.sh'
      - 'bin/portable.sh'
      - 'tests/install-*.sh'
      - 'tests/scheduler-label.sh'
      - 'tests/autodream-now.sh'
      - 'tests/portable.sh'
      - 'tests/lib-assert.sh'
      - 'skills/autodream/SKILL.md'
      - '.github/workflows/launchd.yml'
  schedule:
    - cron: '17 9 * * 1'
  workflow_dispatch:
    inputs:
      suite:
        description: 'full = the whole suite in four shards, web = only the dashboard suite (tests/autodream-web.sh)'
        type: choice
        options: [full, web]
        default: full

concurrency:
  group: launchd-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  launchd:
    if: (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && !(github.event_name == 'workflow_dispatch' && inputs.suite == 'web')
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # coreutils is for `gtimeout` only. Deliberately NOT adding coreutils' gnubin to
      # PATH: this job is here to run the BSD date and stat.
      - name: check deps
        run: |
          jq --version
          python3 --version
          command -v gtimeout >/dev/null 2>&1 || brew install coreutils
          gtimeout --version | head -1

      - name: launchd suites
        run: |
          rc=0
          for t in tests/portable.sh tests/scheduler-label.sh tests/autodream-now.sh \
                   tests/install-dry-run.sh tests/install-dir.sh tests/install-path.sh \
                   tests/install-review-agent.sh tests/install-web-agent.sh \
                   tests/install-skill.sh; do
            echo "== $t"
            bash "$t" || rc=1
          done
          exit $rc

  # The whole suite on macOS, weekly or by hand, in four shards like tests.yml. As one step it
  # outgrew the job's 20-minute timeout: 19m58s on 2026-11-02, then cancelled at 20m on 11-09 and
  # 11-16, so two weeks passed with no full run under bash 3.2. /bin/bash, not the runner's `bash`,
  # because the runner puts Homebrew's bash 5 first on PATH and bash 3.2 is what the nightly uses.
  # Keep the matrix and the /4 in step: tests/shard.sh fails if they disagree.
  full:
    name: full suite (${{ matrix.shard }}/4)
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.suite != 'web')
    runs-on: macos-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: npm ci
        run: npm ci

      - name: check deps
        run: |
          jq --version
          python3 --version
          command -v gtimeout >/dev/null 2>&1 || brew install coreutils
          command -v shfmt >/dev/null 2>&1 || brew install shfmt
          shfmt --version
          /bin/bash --version | head -1

      - name: run-all, shard ${{ matrix.shard }} of 4
        env:
          RUNALL_TIMES: ${{ runner.temp }}/times.txt
        run: RUNALL_SHARD=${{ matrix.shard }}/4 /bin/bash tests/run-all.sh

      - name: slowest entries in this shard
        if: always()
        env:
          RUNALL_TIMES: ${{ runner.temp }}/times.txt
        run: |
          test -f "$RUNALL_TIMES" || { echo "no timings written"; exit 0; }
          awk '{ t += $1 } END { print "total seconds in tests and suites: " t }' "$RUNALL_TIMES"
          sort -rn "$RUNALL_TIMES" | head -12

  # The dashboard suite alone, by hand. 25 of its 31 tests failed here only on the macOS image
  # (#223), so a dispatch with suite=web is the cheap way to see whether a change to
  # bin/autodream-web.py holds on this userland without paying for four full shards.
  web:
    name: web dashboard suite
    if: github.event_name == 'workflow_dispatch' && inputs.suite == 'web'
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: web suite
        run: /bin/bash tests/autodream-web.sh
